# Hardened static config for the private project-graph dashboard.
# Served by nginx-unprivileged (listens on 8080, runs as uid 101).
# The site is private: no caching, no indexing, no external loads.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  projects.plexlab.site;

    root   /usr/share/nginx/html;
    index  index.html;

    server_tokens     off;
    autoindex         off;
    absolute_redirect off;

    # Private content: never cache, never index, never frame.
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Graphify's generated HTML needs inline script/style; everything else is
    # self-only, so the page cannot load or send anything off-host.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # Plain-text liveness probe for the container healthcheck and Traefik.
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Deny dotfiles anywhere in the tree (.git, .htaccess, backups, ...).
    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
