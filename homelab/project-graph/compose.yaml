# project-graph — private Graphify dashboard at https://projects.plexlab.site
#
# The generated graph HTML is PRIVATE and never committed to this public repo.
# It is reconstructed on the deploy host from encrypted GitHub Actions secrets
# into ./site/ (gitignored). Only the public vis-network library and this
# infrastructure live in Git. See README.md for the full runbook.
services:
  project-graph:
    # Pinned by digest — do not bump without re-verifying the vendored JS hash.
    image: nginxinc/nginx-unprivileged:1.28-alpine@sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8
    container_name: project-graph
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Private reconstructed HTML (deploy host only, never in Git).
      - ./site:/usr/share/nginx/html:ro
      # Public vendored vis-network bundle — makes /assets/ serve the repo
      # asset directly, no copy into the private site dir needed.
      - ./assets:/usr/share/nginx/html/assets:ro
      # nginx-unprivileged keeps pid + temp/cache paths under /tmp.
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 33554432
    # No published host ports — reachable only via the Traefik proxy network.
    expose:
      - "8080"
    networks:
      - proxy
    healthcheck:
      # alpine image ships busybox wget; curl is not installed.
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.routers.project-graph.rule=Host(`projects.plexlab.site`)
      - traefik.http.routers.project-graph.entrypoints=websecure
      - traefik.http.routers.project-graph.tls=true
      - traefik.http.services.project-graph.loadbalancer.server.port=8080

networks:
  proxy:
    external: true
